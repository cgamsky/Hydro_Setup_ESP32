hydro_dose_ph_up_5s:
  alias: Hydro - Dose pH Up 5s
  mode: single
  icon: mdi:arrow-up-bold
  sequence:
    - service: switch.turn_on
      target:
        entity_id: switch.hydroponics_controller_node_peristaltic_pump_1_ph_up
    - delay: "00:00:05"
    - service: switch.turn_off
      target:
        entity_id: switch.hydroponics_controller_node_peristaltic_pump_1_ph_up

